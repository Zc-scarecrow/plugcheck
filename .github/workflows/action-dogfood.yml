name: Action dogfood

on:
  push:
  pull_request:

jobs:
  dogfood:
    name: Validate demo-plugin with plugcheck-action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run plugcheck-action
        uses: Zc-scarecrow/plugcheck-action@v1
        with:
          path: demo-plugin
          format: human
