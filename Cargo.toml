[package]
name = "plugcheck"
version = "0.1.0"
edition = "2024"
description = "A fast validator and scaffolding CLI for the Agent Plugins 1.0 open standard"
license = "MIT"
repository = "https://github.com/yourname/plugcheck"
readme = "README.md"
keywords = ["agent-plugins", "ai-agents", "cli", "validator", "linter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "plugcheck"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
